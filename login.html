<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Login — MeAndYou</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<div class="logo small">M</div>
<h1>Welcome back</h1>
<p>Log in with your username or email.</p>
<form id="authForm" novalidate>
<label for="loginId">Username or email</label>
<input id="loginId" type="text" autocomplete="username" placeholder="@username or you@example.com" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Your password" minlength="6" required>
<button class="primary" type="submit">Log in</button>
</form>
<button id="forgotPassword" class="text-button" type="button">Forgot password?</button>
<p id="authMessage" class="message" role="status"></p>
<div class="switch-auth">Don't have an account? <a href="signup.html">Create one</a></div>
</section>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
