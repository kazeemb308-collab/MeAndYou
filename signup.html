<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#075e54">
  <title>Create account — MeAndYou</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="logo small">M</div>
      <h1>Create your account</h1>
      <p>Join MeAndYou and start messaging.</p>

      <form id="signupForm" novalidate>
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>

        <button class="primary" type="submit">Create account</button>
      </form>

      <button id="googleBtn" class="google" type="button">Continue with Google</button>
      <p id="authMessage" class="message" role="status"></p>

      <div class="switch-auth">Already have an account? <a href="login.html">Log in</a></div>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
